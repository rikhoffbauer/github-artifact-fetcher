name: Persist scraper validation chunk status

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  check:
    if: startsWith(github.event.issue.title, '[validate-scraper]') && github.event.comment.body == 'CHECK_CHUNKS_FILE'
    runs-on: ubuntu-latest
    steps:
      - name: Persist uploaded chunk indices
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          indices="$(gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments" --jq '.[] | select(.body | startswith("CHUNK ")) | .body[6:9]' | sort | tr '\n' ',')"
          indices="${indices%,}"
          count="$(tr ',' ' ' <<<"$indices" | wc -w | tr -d ' ')"
          status="count=$count\nindices=$indices\n"
          path="tmp/chunk-status-$ISSUE_NUMBER.txt"
          encoded="$(printf '%b' "$status" | base64 -w0)"
          sha="$(gh api "repos/$REPOSITORY/contents/$path" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$REPOSITORY/contents/$path" -f message='ci: update validation chunk status' -f content="$encoded" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$REPOSITORY/contents/$path" -f message='ci: record validation chunk status' -f content="$encoded" >/dev/null
          fi
