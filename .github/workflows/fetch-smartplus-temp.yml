name: Temporary SMART+ XAPK fetch

on:
  push:
    paths:
      - .github/workflows/fetch-smartplus-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify SMART+ XAPK
        shell: bash
        run: |
          set -euo pipefail
          url='https://d.apkpure.net/b/XAPK/com.ledvance.smartunify?version=latest'
          file='SMART+_2.1.32_APKPure.xapk'
          expected='a179191516563093a9d1da073ec4e241fbb8c949813d5afe8490611266b2dacb'
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 1200 -o "$file" "$url"
          printf '%s  %s\n' "$expected" "$file" | sha256sum -c -
          stat -c 'bytes=%s' "$file"

      - name: Upload XAPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: smartplus-xapk
          path: SMART+_2.1.32_APKPure.xapk
          compression-level: 0
          retention-days: 1
